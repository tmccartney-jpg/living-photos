name: Daily rotation

# Picks the day's scene, caption and intro for every frame (rotation.json),
# and runs the Severance crossfade bookkeeping. See tools/rotate.py.
on:
  schedule:
    # Five tries each morning: GitHub runs scheduled jobs late (or skips them) when busy.
    # The first run that gets through picks the day's scene; later ones see it's done and skip.
    - cron: "7 8 * * *"      # 4:07 am EDT / 3:07 am EST
    - cron: "7 9 * * *"      # 5:07 am EDT / 4:07 am EST
    - cron: "7 10 * * *"     # 6:07 am EDT / 5:07 am EST
    - cron: "7 11 * * *"     # 7:07 am EDT / 6:07 am EST
    - cron: "7 12 * * *"     # 8:07 am EDT / 7:07 am EST
    # Evening runs pick TOMORROW's scene the night before (rotate.py, from 6 pm local);
    # the frames (fw 11+) hold it until change_at, so a late GitHub run can't make the change late.
    # The morning runs above stay as a backup and skip when the day is already picked.
    - cron: "7 23 * * *"     # 7:07 pm EDT / 6:07 pm EST
    - cron: "7 0 * * *"      # 8:07 pm EDT / 7:07 pm EST
    - cron: "7 1 * * *"      # 9:07 pm EDT / 8:07 pm EST
    - cron: "7 2 * * *"      # 10:07 pm EDT / 9:07 pm EST
    - cron: "7 3 * * *"      # 11:07 pm EDT / 10:07 pm EST
  # Editing state.json on GitHub (e.g. setting an "override") runs it within a minute or two.
  # (The rotation's own commits use GITHUB_TOKEN, which never re-triggers workflows.)
  push:
    branches: [main]
    paths: ["state.json"]
  workflow_dispatch:
    inputs:
      force:
        description: "Redraw the scene even if already picked (after 6 pm: tomorrow's)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick today's scene
        run: python tools/rotate.py ${{ inputs.force && '--force' || '' }}

      - name: Commit the result
        run: |
          git config user.name  "living-photos-rotation"
          git config user.email "living-photos-rotation@users.noreply.github.com"
          git add rotation.json state.json twilight-zone/manifest.json
          [ -f severance/manifest.json ] && git add severance/manifest.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily rotation $(python3 -c 'import json;print(json.load(open("rotation.json"))["date"])')"
            git pull --rebase origin main
            git push
          fi
